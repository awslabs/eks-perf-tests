{{$namespaces := DefaultParam .CL2_NAMESPACES 50}}
{{$dsPerNamespace := DefaultParam .CL2_OBJECTS_PER_NAMESPACE 100}}
{{$setupQps := DefaultParam .CL2_SETUP_QPS 100}}
{{$waves := DefaultParam .CL2_WAVES 10}}
{{$settle := DefaultParam .CL2_SETTLE "5m"}}
{{$setupTimeout := DefaultParam .CL2_SETUP_TIMEOUT "20m"}}
{{$waveTimeout := DefaultParam .CL2_WAVE_TIMEOUT "15m"}}
# KWOK nodes the DaemonSet groups use (at most 100); the rest get no test pods.
{{$groupNodes := MinInt .Nodes 100}}

{{$DAEMONSET_THROUGHPUT_THRESHOLD := DefaultParam .CL2_THROUGHPUT_THRESHOLD 1}}

# The DaemonSets with index k (one per namespace) form group k and run on the KWOK nodes labeled kcm-ds-g<k>=on;
# at base each group has 2 nodes (ds-nodes.sh base). Each half-wave labels 1 more node per group (up: every DaemonSet
# creates 1 pod) or removes that label again (down: every DaemonSet deletes 1 pod), then waits until all pods run.
# With 100 groups on 100 nodes a half-wave is 100 node label patches (kubectl, 25 at a time).
# Gate: tolerationTimeout gives the pods totalDaemonSets/threshold seconds from the end of the label step, so unlike a
# ReplicaSet half-wave (timed in effect from the start of its Scale step) the label step's own few seconds are not
# counted; otherwise as in replicaset/config.yaml: a half-wave still not reconciled at the waveTimeout ceiling also
# fails the test, and the next one starts on top of it. Threshold 1 leaves only that ceiling (record only).
# The ceiling is 15m, not replicaset's 5m: the DaemonSet controller runs 2 workers by default. The setup wait is fatal.
# The Exec steps run from CL2's working directory, perf-tests/clusterloader2 (kcm-controller-throughput Task).
{{$nodesScript := "../../kubernetes-iteration-toolkit/tests/assets/kcm-controller-throughput/daemonset/ds-nodes.sh"}}
{{$totalDaemonSets := MultiplyInt $namespaces $dsPerNamespace}}
{{$reconcileLimit := MaxFloat 1 (DivideFloat $totalDaemonSets $DAEMONSET_THROUGHPUT_THRESHOLD)}}

name: daemonset-throughput
namespace:
  number: {{$namespaces}}
tuningSets:
- name: Setup
  qpsLoad:
    qps: {{$setupQps}}
steps:
- name: Label base nodes
  measurements:
  - Identifier: LabelBaseNodes
    Method: Exec
    Params:
      command: ["bash", "{{$nodesScript}}", "base", "{{$dsPerNamespace}}", "{{$groupNodes}}"]
      timeout: 10m
- name: Create test objects
  phases:
  - namespaceRange:
      min: 1
      max: {{$namespaces}}
    replicasPerNamespace: {{$dsPerNamespace}}
    tuningSet: Setup
    objectBundle:
    - basename: ds
      objectTemplatePath: ds.yaml
- name: Wait for setup pods
  measurements:
  - Identifier: WaitForSetupPods
    Method: WaitForRunningPods
    Params:
      desiredPodCount: {{MultiplyInt $totalDaemonSets 2}}
      labelSelector: group = ds-test
      timeout: {{$setupTimeout}}
      isFatal: true
- name: Settle before load
  measurements:
  - Identifier: Settle
    Method: Sleep
    Params:
      duration: {{$settle}}
{{range $i := Loop $waves}}
{{range $dir := StringSplit "up,down"}}
{{$nodesPerDaemonSet := IfThenElse (eq $dir "up") 3 2}}
- name: Scale {{$dir}} wave {{$i}}
  measurements:
  - Identifier: Label{{$i}}{{$dir}}
    Method: Exec
    Params:
      command: ["bash", "{{$nodesScript}}", "{{$dir}}", "{{$dsPerNamespace}}", "{{$groupNodes}}"]
      timeout: 10m
- name: Reconcile wave {{$i}} {{$dir}}
  measurements:
  - Identifier: Wave{{$i}}{{$dir}}
    Method: WaitForRunningPods
    Params:
      desiredPodCount: {{MultiplyInt $totalDaemonSets $nodesPerDaemonSet}}
      labelSelector: group = ds-test
      refreshInterval: 1s
      tolerationTimeout: {{$reconcileLimit}}s
      timeout: {{$waveTimeout}}
{{end}}
{{end}}
- name: Delete test objects
  phases:
  - namespaceRange:
      min: 1
      max: {{$namespaces}}
    replicasPerNamespace: 0
    tuningSet: Setup
    objectBundle:
    - basename: ds
      objectTemplatePath: ds.yaml
- name: Clear node labels
  measurements:
  - Identifier: ClearNodeLabels
    Method: Exec
    Params:
      command: ["bash", "{{$nodesScript}}", "clear"]
      timeout: 10m
